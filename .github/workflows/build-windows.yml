# Автоматическая сборка Windows .exe без необходимости иметь свой Windows-ПК.
#
# Как это работает: GitHub бесплатно предоставляет облачные Windows-машины
# для публичных (и с ограничениями - для приватных) репозиториев. Этот файл
# запускает на такой машине ровно те же команды, что описаны в BUILD.md
# ("pip install -r requirements.txt" + "pyinstaller main.spec"), но делает
# это автоматически в облаке, а готовый .exe можно скачать одним кликом.
#
# Как запустить:
#   1. Загрузите содержимое этой папки в репозиторий на GitHub
#      (github.com -> New repository -> загрузить файлы, либо через git push).
#   2. Откройте вкладку "Actions" в репозитории на GitHub.
#   3. Слева выберите workflow "Build Windows EXE" -> кнопка "Run workflow".
#   4. Дождитесь завершения (обычно 3-5 минут) - появится зелёная галочка.
#   5. Откройте завершённый запуск -> внизу раздел "Artifacts" ->
#      скачайте "WarehouseApp-Windows" - это ZIP с готовым .exe.
#
# Также запускается автоматически при каждом push в ветку main/master.

name: Build Windows EXE

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}   # позволяет запускать вручную кнопкой "Run workflow"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: pyinstaller main.spec

      - name: Upload built application
        uses: actions/upload-artifact@v4
        with:
          name: WarehouseApp-Windows
          path: dist/WarehouseApp/
          if-no-files-found: error
